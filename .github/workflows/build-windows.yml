name: Windows build and tests

on:
  workflow_call:
    outputs:
      tag:
        description: Version tag from VERSION
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          release_tag="v$(tr -d '\r\n' < VERSION)"
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "$RELEASE_REF" = "refs/tags/$release_tag"
            test -s ".github/release-notes/$release_tag.md"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Checkout Dear ImGui v1.92.6
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ocornut/imgui
          ref: 6ded5230d043aa32c755e65c910c2af5002fb9f9
          path: .deps/imgui
          persist-credentials: false
      - name: Checkout MinHook v1.3.4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TsudaKageyu/minhook
          ref: c3fcafdc10146beb5919319d0683e44e3c30d537
          path: .deps/minhook
          persist-credentials: false
      - name: Install build tools
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-mingw-w64-i686-win32 python3-venv
          python3 -m venv .deps/packaging
          .deps/packaging/bin/pip install pefile==2024.8.26
      - name: Build Windows x86 Release
        run: |
          cmake -S . -B build-win32 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-x86.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMGUI_SOURCE_DIR="$PWD/.deps/imgui" \
            -DMINHOOK_SOURCE_DIR="$PWD/.deps/minhook"
          cmake --build build-win32 --parallel 2
      - name: Package and verify
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 tools/build_release.py --build build-win32 --output dist --tag "$RELEASE_TAG"
          .deps/packaging/bin/python tools/check_release.py \
            "dist/Isaac-LAN-$RELEASE_TAG-windows-x86.zip" --tag "$RELEASE_TAG"
          mkdir ci
          cp build-win32/isaac_lan_core_test.exe build-win32/isaac_lan_net_test.exe \
            build-win32/isaac_lan_log_test.exe build-win32/isaac_lan_diagnostics_test.exe ci/
          cp build-win32/isaac_lan_heap_watch.exe build-win32/isaac_lan_heap_fixture.exe ci/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x86-release
          path: |
            dist/*.zip
            dist/*.sha256
            ci/*.exe
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x86-release
      - name: Check PowerShell formatting and syntax
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -Repository PSGallery
          ./tools/format_powershell.ps1 -Check
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell formatting check failed' }
      - name: Test protocol and saved sessions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-runs/windows | Out-Null
          & ./ci/isaac_lan_core_test.exe 2>&1 | Tee-Object test-runs/windows/core.log
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
      - name: Test state transport
        shell: pwsh
        run: |
          & ./ci/isaac_lan_net_test.exe 2>&1 | Tee-Object test-runs/windows/transport-resources.log
          if ($LASTEXITCODE -ne 0) { throw 'State transport tests failed' }
      - name: Test configuration and launch/run log isolation
        shell: pwsh
        run: |
          & ./ci/isaac_lan_diagnostics_test.exe 2>&1 | Tee-Object test-runs/windows/config.log
          if ($LASTEXITCODE -ne 0) { throw 'Configuration tests failed' }
          & ./ci/isaac_lan_log_test.exe 2>&1 | Tee-Object test-runs/windows/log-metric-resources.log
          if ($LASTEXITCODE -ne 0) { throw 'Log isolation tests failed' }
      - name: Test full dump observer without the game
        shell: pwsh
        run: |
          python tools/check_heap_watch.py --build ci --output test-runs/windows/heap-observer
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic dump capture failed' }
      - name: Preserve Windows resource reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-resource-reports
          path: test-runs/windows/
          if-no-files-found: ignore
