name: Windows build and tests

on:
  workflow_call:
    outputs:
      tag:
        description: Version tag from VERSION
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 512M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Windows compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps/ccache
          key: ubuntu-24.04-mingw-x86-${{ hashFiles('cmake/mingw-x86.cmake', '.github/workflows/build-windows.yml') }}-${{ github.sha }}
          restore-keys: ubuntu-24.04-mingw-x86-${{ hashFiles('cmake/mingw-x86.cmake', '.github/workflows/build-windows.yml') }}-
      - name: Cache packaging dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ubuntu-24.04-packaging-${{ hashFiles('.github/workflows/build-windows.yml') }}
      - name: Resolve version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          release_tag="v$(tr -d '\r\n' < VERSION)"
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "$RELEASE_REF" = "refs/tags/$release_tag"
            test -s ".github/release-notes/$release_tag.md"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Checkout Dear ImGui v1.92.6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ocornut/imgui
          ref: 6ded5230d043aa32c755e65c910c2af5002fb9f9
          path: .deps/imgui
          persist-credentials: false
      - name: Checkout MinHook v1.3.4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TsudaKageyu/minhook
          ref: c3fcafdc10146beb5919319d0683e44e3c30d537
          path: .deps/minhook
          persist-credentials: false
      - name: Install build tools
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++-mingw-w64-i686-win32 python3-venv
          python3 -m venv .deps/packaging
          .deps/packaging/bin/pip install pefile==2024.8.26
      - name: Build Windows x86 Release
        run: |
          cmake -S . -B build-win32 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-x86.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMGUI_SOURCE_DIR="$PWD/.deps/imgui" \
            -DMINHOOK_SOURCE_DIR="$PWD/.deps/minhook"
          cmake --build build-win32 --parallel "$(nproc)"
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats
      - name: Package and verify
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 tools/build_release.py --build build-win32 --output dist --tag "$RELEASE_TAG"
          .deps/packaging/bin/python tools/check_release.py \
            "dist/Isaac-LAN-$RELEASE_TAG-windows-x86.zip" --tag "$RELEASE_TAG"
          python3 tools/bundle_ctest.py export --build build-win32 --output ci
          cp build-win32/isaac_lan_heap_watch.exe build-win32/isaac_lan_heap_fixture.exe ci/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86-release
          path: |
            dist/*.zip
            dist/*.sha256
            ci/
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x86-release
      - name: Cache PowerShell analyzer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Documents/PowerShell/Modules/PSScriptAnalyzer
          key: windows-2022-psscriptanalyzer-1.24.0
      - name: Check PowerShell formatting and syntax
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -EQ '1.24.0')) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -Repository PSGallery
          }
          ./tools/format_powershell.ps1 -Check
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell formatting check failed' }
      - name: Run registered native and UDP tests in parallel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-runs/windows | Out-Null
          python tools/bundle_ctest.py configure ci
          if ($LASTEXITCODE -ne 0) { throw 'Native test bundle configuration failed' }
          ctest --test-dir ci --parallel $env:NUMBER_OF_PROCESSORS --output-on-failure --no-tests=error --output-junit "$PWD/test-runs/windows/ctest.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Native CTest suite failed' }
      - name: Test full dump observer without the game
        shell: pwsh
        run: |
          python tools/check_heap_watch.py --build ci --output test-runs/windows/heap-observer
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic dump capture failed' }
      - name: Preserve Windows resource reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-resource-reports
          path: |
            test-runs/windows/
            ci/Testing/Temporary/
            ci/tests.json
          if-no-files-found: ignore
