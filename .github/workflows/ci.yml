name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      offline_profile:
        description: Offline scenario generation budget
        type: choice
        options: [fast, full]
        default: fast

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, scripts and core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 256M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache check dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            .deps/stylua.zip
          key: ubuntu-24.04-check-tools-${{ hashFiles('tools/requirements-ci.txt', '.github/workflows/ci.yml') }}
      - name: Cache portable compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps/ccache
          key: ubuntu-24.04-asan-${{ hashFiles('.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: ubuntu-24.04-asan-${{ hashFiles('.github/workflows/ci.yml') }}-
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache lua5.3 liblua5.3-dev python3-venv
          python3 -m venv .deps/checks
          .deps/checks/bin/pip install -r tools/requirements-ci.txt
          if [ ! -f .deps/stylua.zip ]; then
            curl -fsSL --retry 3 \
              https://github.com/JohnnyMorganz/StyLua/releases/download/v2.0.2/stylua-linux-x86_64.zip \
              -o .deps/stylua.zip
          fi
          echo 'ee9f8f9ba7c19079809d017a5d3f265a9575d1313c0fd24562cbabb99ed26f4f  .deps/stylua.zip' | sha256sum --check
          .deps/checks/bin/python -m zipfile -e .deps/stylua.zip .deps/checks/bin
          chmod +x .deps/checks/bin/stylua
          echo "$PWD/.deps/checks/bin" >> "$GITHUB_PATH"
      - name: Run the offline suite with sanitizers
        env:
          OFFLINE_PROFILE: ${{ inputs.offline_profile || 'fast' }}
        run: |
          python tools/test.py --profile "$OFFLINE_PROFILE" --sanitizers \
            --jobs "$(nproc)" --build-dir build-core --report-dir test-runs/ci
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats
      - name: Preserve offline test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-test-reports
          path: test-runs/ci/
          if-no-files-found: ignore

  windows:
    name: Windows x86 build and tests
    uses: ./.github/workflows/build-windows.yml
