name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      offline_profile:
        description: Offline scenario generation budget
        type: choice
        options: [fast, full]
        default: fast

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, scripts and core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build lua5.3 python3-venv
          python3 -m venv .deps/checks
          .deps/checks/bin/pip install -r tools/requirements-ci.txt
          curl -fsSL --retry 3 \
            https://github.com/JohnnyMorganz/StyLua/releases/download/v2.0.2/stylua-linux-x86_64.zip \
            -o .deps/stylua.zip
          echo 'ee9f8f9ba7c19079809d017a5d3f265a9575d1313c0fd24562cbabb99ed26f4f  .deps/stylua.zip' | sha256sum --check
          .deps/checks/bin/python -m zipfile -e .deps/stylua.zip .deps/checks/bin
          chmod +x .deps/checks/bin/stylua
          echo "$PWD/.deps/checks/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: python tools/format.py --check
      - name: Check Python and Lua syntax
        run: python tools/check_scripts.py
      - name: Test tools, semantic state and continuous behavior without the game
        env:
          OFFLINE_PROFILE: ${{ inputs.offline_profile || 'fast' }}
        run: |
          python -m pytest --offline-profile "$OFFLINE_PROFILE" \
            --offline-report-dir test-runs/ci/traces \
            --junitxml test-runs/ci/pytest.xml --durations=10 -q
      - name: Build portable tests with sanitizers
        run: |
          cmake -S . -B build-core -G Ninja \
            -DISAAC_LAN_BUILD_ENGINE=OFF -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build-core --parallel 2
      - name: Test protocol and saved sessions
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p test-runs/ci/sanitizers
          ctest --test-dir build-core --output-on-failure --output-junit "$PWD/test-runs/ci/sanitizers/ctest.xml"
      - name: Preserve offline test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-test-reports
          path: test-runs/ci/
          if-no-files-found: ignore

  windows:
    name: Windows x86 build and tests
    uses: ./.github/workflows/build-windows.yml
